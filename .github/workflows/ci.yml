name: ci

# Fires on main, and on PRs. The branch filter is not decoration: with a bare
# `on: [push, pull_request]` a push to a branch fires BOTH events, so every job ran
# twice — 12 check runs for 6 jobs. That doubled the cost and made the names ambiguous
# for branch protection, where a required check matched two runs of the same name.
#
# NOT YET HERE: the silenced-lies suite — the cases the rails must NOT catch. Until it
# exists there is no gate on this project's most important property (CONTRIBUTING
# rule 2: it must not get cleverer about intent). It lands with the suite, and this
# comment goes away with it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # The test matrix. This is a pre-commit hook and it reads filesystems, so it has to
  # work on the Python versions people actually run and on both platforms they run it on.
  # `whypass demo` is kept as its own step: it is the one thing that exercises the whole
  # path end to end, including the honesty table.
  # ---------------------------------------------------------------------------
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        env:
          PYTHONHASHSEED: "0"
        run: pytest -q
      - name: The demo still demos
        run: whypass demo

  # ---------------------------------------------------------------------------
  # Lint and format. Determinism is this project's stated commitment — every rail is a
  # regex or a filesystem check — and linting is the cheap mechanical part of meaning it.
  # ---------------------------------------------------------------------------
  lint:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # Types.
  # ---------------------------------------------------------------------------
  types:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy
        run: mypy src

  # ---------------------------------------------------------------------------
  # DCO sign-off. See CONTRIBUTING.md — sign-off only, no CLA. Implemented inline with
  # no third-party action: the action our standard used to name declares `using:
  # node12`, and on a sibling repository that retired runtime failed SILENTLY while
  # being a required check, which blocked every pull request without saying why.
  # ---------------------------------------------------------------------------
  dco:
    name: DCO check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on every PR commit
        run: |
          set -u
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          merge_base=$(git merge-base "$base" "$head")
          fail=0
          for sha in $(git rev-list "$merge_base..$head"); do
            name=$(git log -1 --format='%an' "$sha")
            email=$(git log -1 --format='%ae' "$sha")
            expected="Signed-off-by: ${name} <${email}>"
            # fixed-string match: an author email can contain regex metacharacters
            if git log -1 --format='%B' "$sha" | sed 's/[[:space:]]*$//' | grep -qixF "$expected"; then
              echo "OK    $sha  ($email)"
            else
              echo "::error::commit $sha is missing '${expected}'"
              fail=1
            fi
          done
          exit $fail

  # ---------------------------------------------------------------------------
  # Build. Confirms the wheel and the sdist assemble, and prints what the sdist
  # actually contains — a source distribution that quietly omits the project's own
  # files is a defect nobody notices until someone downloads it. Does NOT publish.
  # ---------------------------------------------------------------------------
  build:
    name: build sdist + wheel
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install --upgrade pip build
      - name: Build
        run: python -m build
      - name: Show what the sdist contains
        run: |
          python - <<'PY'
          import glob, tarfile
          path = sorted(glob.glob("dist/*.tar.gz"))[-1]
          with tarfile.open(path) as t:
              names = t.getnames()
          print(path, f"({len(names)} entries)")
          for n in names[:40]:
              print("  ", n)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/*
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Privacy. This repository is where the claim-checking lives, so a credential in it
  # would be the least forgivable possible bug — and the rails read files, so a private
  # path in a test fixture is a real disclosure rather than a style problem.
  # ---------------------------------------------------------------------------
  privacy:
    name: privacy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No key material or credentials in tracked files
        run: |
          set -euo pipefail
          # .github/workflows/ is skipped because THIS FILE carries the patterns as text;
          # without the exclusion the check matches itself and fails on every run.
          files=$(git ls-files | grep -vE '^\.github/workflows/')
          hits=$(echo "$files" | xargs grep -nIE \
            'BEGIN [A-Z ]*PRIVATE KEY|PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}' \
            2>/dev/null || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::possible credential in a tracked file"; exit 1; fi
          echo "clean"
      - name: No absolute private paths
        run: |
          set -euo pipefail
          hits=$(git ls-files | xargs grep -nIE '/home/(au|bu)/|/Users/s_[a-z]+/' 2>/dev/null || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::an absolute private path is in a tracked file"; exit 1; fi
          echo "clean"
