[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whypass"
version = "0.1.2"
description = "A claim-discipline linter for text: catch assertions that outrun their evidence, and claims that contradict your record. Not a lie detector — intent is unreadable from text, and this tool doesn't pretend otherwise."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Illia Hladkyi" }]
keywords = ["deception", "hallucination", "linter", "llm", "claims", "epistemics", "honesty"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
whypass = "whypass.cli:main"

[project.urls]
Homepage = "https://github.com/myfjin/whypass"
Changelog = "https://github.com/myfjin/whypass/releases"
Contributing = "https://github.com/myfjin/whypass/blob/main/CONTRIBUTING.md"
Security = "https://github.com/myfjin/whypass/blob/main/SECURITY.md"

[project.optional-dependencies]
# Bounded on purpose: a linter upgrade can ADD rules, and that must be a deliberate
# change with a look at the new findings — not a red build on a required check nobody
# edited that day.
dev = [
    "pytest>=7.0",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/whypass"]
